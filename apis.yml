name: Cracked API
description: >-
  Cracked is a tool router for AI agents: one API key and one prepaid balance to discover, inspect, run and poll
  thousands of third-party tools. It exposes 9,521 endpoints from 1,183 providers plus 50,000+ Apify actors, publishing
  measured success rate, median latency and per-call price per tool.
