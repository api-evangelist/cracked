  "/datasets/{id}":
    get:
      summary: "Read a dataset: json (paged by cursor=seq), csv (flattened one level) or ndjson"
      security:
        - bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: query
          schema:
            type: string
            enum:
              - json
              - csv
              - ndjson
            default: json
        - name: limit
          in: query
          schema:
            type: integer
            maximum: 1000
        - name: cursor
          in: query
          schema:
            type: integer
        - name: download
          in: query
          schema:
            type: integer
            enum:
              - 1
