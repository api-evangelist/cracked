      security:
        - bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          "application/json":
            schema:
              type: object
              properties:
                name:
                  type: string
                cron:
                  type: string
                  nullable: true
                every:
                  type: string
                  nullable: true
                input:
                  type: object
                webhook_url:
                  type: string
                  nullable: true
                dataset:
                  type: string
                  enum:
